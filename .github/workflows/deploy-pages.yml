name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# The demo's "3D Satellite" layer: Lower Manhattan and Coeur d'Alene tiles (lidar heights) with
# their buildings as textured meshes and the trees as splats, kept out of git as a release asset
# (built by SplatMap, packed by its scripts/pack-tiles.sh) and served from this site. Manhattan
# covers the example's default view, so the 3D Satellite button works where the page opens; from
# anywhere else it jumps to the nearest region (VITE_SPLATS_REGION; Coeur d'Alene brings its
# basemap). The splat-buildings set it replaced is release demo-tiles-manhattan-v2.
env:
  DEMO_TILES_RELEASE: demo-tiles-mesh-v1
  DEMO_TILES_ASSET: demo-tiles-mesh-v1.tar.gz
  DEMO_TILES_SHA256: 2fdf16518f6c2fbf8cfe831fc68462e1492cc2c444a3bea77066f3c59a224384

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch the demo's splat tiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$DEMO_TILES_RELEASE" --repo "$GITHUB_REPOSITORY" \
            --pattern "$DEMO_TILES_ASSET" --output demo-tiles.tar.gz
          echo "$DEMO_TILES_SHA256  demo-tiles.tar.gz" | sha256sum -c -

      # Tile templates are under the demo's base path (vite.config.ts: /HereBeDragons/).
      - run: npm run build:demo
        env:
          VITE_SPLATS_TEMPLATE: /HereBeDragons/tiles/full/{z}/{x}/{y}.spz
          VITE_SPLATS_REGION: 40.7065,-74.009,15;47.7058,-116.7712,17,cda.pmtiles
          VITE_SPLATS_BUILDING_MESHES: '1'

      - name: Add the tiles to the site
        run: tar -xzf demo-tiles.tar.gz -C dist

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
