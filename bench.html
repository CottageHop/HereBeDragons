<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HereBeDragons — FPS benchmark</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d10; }
      #app { position: fixed; inset: 0; }
      #bench-panel {
        position: fixed; top: 16px; left: 16px; z-index: 10;
        background: rgba(16,18,22,.86); color: #f4f6f8;
        border: 1px solid rgba(255,255,255,.12); border-radius: 12px;
        padding: 14px 16px; backdrop-filter: blur(8px);
        box-shadow: 0 8px 30px rgba(0,0,0,.45); min-width: 280px;
      }
      #bench-panel h1 { font: 600 12px/1 system-ui; letter-spacing: .08em;
        text-transform: uppercase; opacity: .55; margin: 0 0 10px; }
      code { background: rgba(255,255,255,.1); padding: 1px 5px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="bench-panel">
      <h1>FPS Benchmark</h1>
      <div id="bench-out" style="font:400 13px/1.5 system-ui">loading…</div>
    </div>
    <script type="module" src="/examples/bench/main.ts"></script>
  </body>
</html>
